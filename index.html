<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            background-color: #ffe5ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #ff4d6d;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .profile-img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff758f;
            margin-bottom: 20px;
        }
        .message {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
            white-space: pre-line;
        }
        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(255, 77, 109, 0.3);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff758f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ကိုကို့ရဲ့ ငယ်လေးအတွက် 🥰</h1>
    
    <img src="https://i.ibb.co/fzR9B2j4/IMG-20260509183916128.jpg" alt="Our Memory" class="profile-img">

    <div class="message">
        ငယ်လေးရေ...

        ကိုကို့ဘဝထဲ ရောက်လာပေးလို့ ကျေးဇူးအများကြီးတင်ပါတယ်ဗျာ။
        အမြဲတမ်းလည်း လွမ်းနေရတယ်နော်။
        ဂိမ်းတွေပဲ ဆော့မနေပါဘူး၊ ငယ်လေးကိုလည်း မပစ်ထားပါဘူးဗျာ။
        စိတ်ကောက်ပြေပါတော့နော်... ❤️
    </div>

    <button class="btn" onclick="showSurprise()">ဒီမှာနှိပ်လိုက်ပါဦး 💖</button>
</div>

<script {disabled}>
    function showSurprise() {
        alert("Surprise! ✉️\n\nကမ္ဘာပေါ်မှာ ငယ်လေးကို အချစ်ဆုံးပဲ။ 🌹✨");
    }
</script>

</body>
</html>
